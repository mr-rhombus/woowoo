<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashley & Max</title>
    <link
      rel="shortcut icon"
      href="/ui/assets/img/am-logo.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Kapakana:wght@300..400&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ui/style.css" />
    <link rel="stylesheet" href="/ui/pages/pages.css" />
    <link rel="stylesheet" href="/ui/pages/rsvp/rsvp.css" />
    <script src="/ui/pages/pages.js" defer></script>
    <script src="/ui/pages/rsvp/rsvp.js" defer></script>
  </head>
  <body>
    <div class="nav">
      <ul>
        <li>
          <a href="/ui/pages/home/home.html">home</a>
        </li>
        <li><a href="/ui/pages/home/home.html#schedule">schedule</a></li>
        <li><a href="/ui/pages/faq/faq.html">faq</a></li>
        <li class="nav-active">
          <a href="/ui/pages/rsvp/rsvp.html">rsvp</a>
        </li>
      </ul>
    </div>
    <dialog class="modal" id="customModal">
      <div class="modal-content">
        <h2>Update plus-one</h2>

        <div class="input-group">
          <div class="input-group-label">
            <label for="newGuestName">Enter new guest name</label>
          </div>
          <input
            type="text"
            name="newGuestName"
            id="newGuestName"
            placeholder="First Last"
          />
        </div>

        <div class="modal-actions">
          <button class="modal-btn cancel-btn" id="closeModalBtn">
            Cancel
          </button>
          <button class="modal-btn submit-btn" id="modalSubmitBtn">
            Submit
          </button>
        </div>
      </div>
    </dialog>
    <div class="container">
      <div class="title">RSVP</div>
      <div class="instructions">
        Please enter the first and last name of one member of your party below.
        If you're responding for you and a guest (or your family), you'll be
        able to RSVP for your entire group.
      </div>
      <form id="findParty">
        <label for="fullName">Guest Full Name</label>
        <input
          type="text"
          name="fullName"
          id="fullName"
          autofocus
          placeholder="Dino Williams-Diamond"
        />
        <div class="btn-container">
          <button id="findPartyBtn">Find Party</button>
        </div>
      </form>
      <div class="guests"></div>
      <div class="btn-container"><button id="rsvp">RSVP</button></div>
      <div class="validation-warning">
        Please add the first and last name of your plus-one!
      </div>
    </div>
    <script
      data-goatcounter="https://dinosaur.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
