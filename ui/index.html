<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashley and Max's Wedding!</title>
    <link
      rel="shortcut icon"
      href="/ui/assets/img/am-logo.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/ui/style.css" />
    <link rel="stylesheet" href="/ui/pages/pages.css" />
    <link rel="stylesheet" href="/ui/pages/password/password.css" />
    <script src="/ui/pages/pages.js" defer></script>
    <script type="module" src="/ui/pages/password/password.js" defer></script>
  </head>
  <body>
    <div class="index-img">
      <img
        src="/ui/assets/img/vn-garden-watercolor-color.png"
        alt="Watercolor picture of Italian gardens"
      />
    </div>
    <div class="index-logo">
      <img
        src="/ui/assets/img/am-logo.png"
        alt="Ashley and Max's wedding logo"
      />
    </div>
    <form id="passwordForm">
      <input
        type="password"
        name="pwd"
        id="pwd"
        placeholder="Enter Password"
        autofocus
      />
      <button type="submit" id="pwdSubmitBtn">LOGIN</button>
    </form>
  </body>
</html>
